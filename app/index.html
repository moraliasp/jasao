<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <script type="module" src="/src/main.ts"></script>
    <style>
      /* Tokens do mockup (docs/mockup-json.html), que vêm do Leve. */
      :root {
        --bar-bg: #f6f8fa; --bar-fg: #1f2328; --bar-muted: #656d76; --border: #d0d7de;
        --page-bg: #ffffff; --accent: #0969da; --hover: rgba(0,0,0,0.06);
        --change: #9a6700; --ok: #1a7f37; --del: #cf222e;
        /* Régua do micronavegador: neutro, as 4 variantes mais frequentes e "outros". */
        --rg-neutro: #eaeef2; --rg-1: #1b7c83; --rg-2: #8250df; --rg-3: #bc4c00; --rg-4: #bf3989; --rg-outros: #8c959f;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      }
      :root[data-theme="dark"] {
        --bar-bg: #161b22; --bar-fg: #e6edf3; --bar-muted: #8d96a0; --border: #30363d;
        --page-bg: #0d1117; --accent: #2f81f7; --hover: rgba(255,255,255,0.08);
        --change: #d29922; --ok: #3fb950; --del: #f85149;
        --rg-neutro: #21262d; --rg-1: #39c5cf; --rg-2: #a371f7; --rg-3: #f0883e; --rg-4: #db61a2; --rg-outros: #6e7681;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body { display: flex; flex-direction: column; background: var(--page-bg); color: var(--bar-fg); font-size: 14px; line-height: 1.5; scrollbar-color: var(--border) transparent; }
      ::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 4px; }
      button, input { font: inherit; color: inherit; }
      svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

      .top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; height: 44px; padding: 0 10px; background: var(--bar-bg); border-bottom: 1px solid var(--border); }
      .top .side { display: flex; align-items: center; gap: 8px; }
      .top .side.end { justify-content: flex-end; }
      .top .name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .ib { display: grid; place-items: center; width: 28px; height: 28px; border: 0; border-radius: 6px; background: none; color: var(--bar-muted); cursor: pointer; }
      .ib:hover { background: var(--hover); color: var(--bar-fg); }
      .btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--page-bg); font-size: 13px; cursor: pointer; white-space: nowrap; }
      .btn:hover { background: var(--hover); }
      .btn:active { transform: translateY(1px); }
      .btn:disabled { opacity: .5; cursor: default; }

      main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
      .views { display: flex; gap: 4px; padding: 0 24px; border-bottom: 1px solid var(--border); }
      .views button { padding: 10px 10px 9px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--bar-muted); font-size: 13px; }
      .views button[aria-selected="true"] { color: var(--bar-fg); font-weight: 600; border-bottom-color: var(--accent); }
      .pane { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 16px 24px 16px; }
      .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 10px; font-size: 13px; }
      .tools form { display: flex; align-items: center; gap: 6px; color: var(--bar-muted); }
      .tools input { width: 110px; height: 28px; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--page-bg); font-variant-numeric: tabular-nums; }
      .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; min-width: 0; margin: 0; padding: 0; list-style: none; font: 12.5px/1.5 var(--mono); color: var(--bar-muted); }
      .crumbs li + li::before { content: "›"; margin: 0 6px; }
      .crumbs li:last-child { color: var(--bar-fg); }
      .tools .acts { margin-left: auto; }
      /* Barra de busca (mockup: .busca). */
      .barra { gap: 8px; }
      .busca { display: flex; align-items: center; gap: 4px; }
      .busca .campo { display: flex; align-items: center; height: 28px; border: 1px solid var(--border); border-radius: 6px; background: var(--page-bg); }
      .busca .campo:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
      .busca input { width: 240px; height: 26px; padding: 0 10px; border: 0; background: none; font-variant-numeric: normal; }
      .busca input:focus-visible { outline: 0; }
      .busca .alt { width: 26px; height: 22px; margin-right: 2px; font: 12px/1 var(--mono); }
      .busca .alt[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
      .consulta { flex: 1; min-width: 0; }
      .consulta .campo { flex: 1; min-width: 160px; max-width: 520px; }
      .consulta input { width: 100%; font-family: var(--mono); font-size: 12.5px; }
      .consulta .campo:has(input[aria-invalid="true"]) { border-color: var(--del); }
      .busca .ib:disabled { opacity: .4; cursor: default; }
      .busca .info { min-width: 9ch; color: var(--bar-muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .busca .info.err { color: var(--del); white-space: normal; }
      .rot180 { transform: rotate(180deg); }
      .ac { background: color-mix(in srgb, var(--change) 28%, transparent); color: inherit; border-radius: 2px; }
      .menu { position: fixed; z-index: 20; min-width: 210px; padding: 4px; border: 1px solid var(--border); border-radius: 8px; background: var(--page-bg); box-shadow: 0 8px 24px rgba(0,0,0,0.18); }
      .menu[hidden] { display: none; }
      .menu button { display: flex; justify-content: space-between; gap: 16px; width: 100%; height: 28px; padding: 0 10px; border: 0; border-radius: 4px; background: none; font-size: 13px; text-align: left; cursor: pointer; }
      .menu button:hover, .menu button:focus-visible { background: color-mix(in srgb, var(--accent) 14%, transparent); outline: 0; }
      .menu kbd { color: var(--bar-muted); font: inherit; }
      .ac.at { background: color-mix(in srgb, var(--change) 60%, transparent); box-shadow: 0 0 0 1px var(--change); }
      .status { color: var(--bar-muted); font-size: 12px; font-variant-numeric: tabular-nums; }

      /* Árvore virtualizada: só as linhas visíveis existem no DOM. */
      .tree { position: relative; flex: 1; min-height: 0; overflow: auto; border: 1px solid var(--border); border-radius: 6px; font: 12.5px/1.5 var(--mono); }
      .tree:focus-visible { outline-offset: -2px; border-radius: 6px; }
      .alto { width: 1px; }
      .rows { position: sticky; top: 0; overflow: hidden; }
      .row { display: flex; align-items: center; gap: 8px; height: 26px; padding-right: 8px; white-space: nowrap; cursor: default; }
      .row:hover { background: var(--hover); }
      .row[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); }
      .tree:focus-visible .row[aria-selected="true"] { box-shadow: inset 2px 0 var(--accent); }
      .row .tg, .row .sp { display: grid; place-items: center; width: 20px; height: 20px; flex: none; color: var(--bar-muted); border-radius: 4px; }
      .row .tg:hover { background: var(--hover); color: var(--bar-fg); }
      .row .tg svg { width: 13px; height: 13px; }
      .row .key { color: var(--bar-muted); }
      .row .val { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      .row .dim { color: var(--bar-muted); }
      .row .err { color: var(--del); display: inline-flex; gap: 6px; align-items: center; flex: none; }
      .row .err svg { width: 13px; height: 13px; }
      .row .cp { margin-left: auto; width: 22px; height: 22px; opacity: 0; }
      .row .cp svg { width: 13px; height: 13px; }
      .row:hover .cp { opacity: 1; }
      @media (hover: none) { .row .cp { opacity: 1; } }
      .views kbd { margin-left: 6px; font: 11px var(--mono); color: var(--bar-muted); font-weight: 400; }
      [hidden] { display: none !important; }

      /* Texto: uma linha crua por registro, também virtualizada. */
      .texto .rows { overflow-x: visible; overflow-y: clip; width: max-content; min-width: 100%; }
      .tl { display: flex; height: 20px; line-height: 20px; white-space: pre; cursor: text; }
      .tl[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 7%, transparent); }
      .tl .nl { position: sticky; left: 0; flex: none; padding-right: 12px; text-align: right; color: var(--bar-muted); background: var(--page-bg); user-select: none; }
      .tl[aria-selected="true"] .nl { color: var(--bar-fg); box-shadow: inset 2px 0 var(--accent); }
      .tl .tx { padding-right: 16px; }
      .tl .k { color: var(--accent); }
      .tl .s { color: var(--ok); }
      .tl .n, .tl .l { color: var(--change); }
      .tl .p { color: var(--bar-muted); }
      .tl .hl { background: color-mix(in srgb, var(--accent) 22%, transparent); }
      .tl .corte { margin-left: 8px; color: var(--bar-muted); font-style: italic; }
      dialog { width: min(900px, calc(100vw - 32px)); max-height: calc(100vh - 64px); padding: 0; border: 1px solid var(--border); border-radius: 8px; background: var(--page-bg); color: var(--bar-fg); }
      dialog::backdrop { background: rgba(0,0,0,.35); }
      dialog[open] { display: flex; flex-direction: column; }
      dialog header { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px 16px; border-bottom: 1px solid var(--border); }
      dialog h2 { margin: 0; font-size: 13px; font-weight: 600; }
      dialog pre { margin: 0; padding: 12px 16px; overflow: auto; font: 12.5px/1.5 var(--mono); }
      .vazio { margin: 24px; color: var(--bar-muted); }

      /* Micronavegador: régua do arquivo inteiro ao lado das visões. */
      .vista { flex: 1; display: flex; gap: 8px; min-height: 0; }
      .vista > .tree { min-width: 0; }
      .regua { position: relative; flex: none; width: 44px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--rg-neutro); cursor: pointer; touch-action: none; }
      .regua canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      .regua .rc { opacity: 0; }
      .regua .rc.pronta { opacity: 1; }
      .regua .janela { position: absolute; top: 0; left: 1px; right: 1px; border: 2px solid var(--bar-fg); border-radius: 3px; box-shadow: 0 0 0 1px var(--page-bg), inset 0 0 0 1px var(--page-bg); background: color-mix(in srgb, var(--page-bg) 35%, transparent); pointer-events: none; }
      .balao { position: absolute; right: 3px; z-index: 1; min-width: 18px; height: 16px; padding: 0 4px; border: 0; border-radius: 8px; background: var(--del); color: var(--page-bg); font: 600 10px/16px var(--mono); cursor: pointer; }
      @keyframes pulsar { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--del) 70%, transparent); } to { box-shadow: 0 0 0 7px transparent; } }
      .pt { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
      .pt.c1 { background: var(--rg-1); } .pt.c2 { background: var(--rg-2); } .pt.c3 { background: var(--rg-3); }
      .pt.c4 { background: var(--rg-4); } .pt.c5 { background: var(--rg-outros); }
      .tl .nl .pt { position: absolute; left: 6px; top: 6px; }
      .legenda { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 12.5px; color: var(--bar-muted); }
      .legenda code { font: 12px var(--mono); color: var(--bar-fg); }
      .legenda ul { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 0; padding: 0; list-style: none; }
      .legenda li { display: inline-flex; align-items: center; gap: 5px; font: 12px var(--mono); color: var(--bar-fg); }
      .top .faixa { margin-left: 10px; font-weight: 400; color: var(--bar-muted); font-variant-numeric: tabular-nums; }

      /* Painel de entrada: não modal, ocupa o lugar do conteúdo até escolher um modo. */
      .painel { flex: 1; overflow: auto; padding: 32px 24px; }
      .painel > div { max-width: 760px; margin: 0 auto; }
      .pc { display: flex; align-items: center; gap: 12px; }
      .pc .pi { display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--border); border-radius: 8px; background: var(--bar-bg); color: var(--accent); flex: none; }
      .pc .pi svg { width: 20px; height: 20px; }
      .pc > div { min-width: 0; flex: 1; }
      .pc h1 { margin: 0; font: 600 15px/1.4 var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .pc p { margin: 0; color: var(--bar-muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
      .selo { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border: 1px solid var(--border); border-radius: 12px; color: var(--bar-muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .selo.fim { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
      .selo svg { width: 13px; height: 13px; }
      .indic { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 24px 0 28px; }
      .indic div { padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; }
      .indic dt { color: var(--bar-muted); font-size: 12px; }
      .indic dd { margin: 2px 0 0; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .indic .aviso { border-color: color-mix(in srgb, var(--change) 45%, transparent); background: color-mix(in srgb, var(--change) 7%, transparent); }
      .indic .aviso dd { color: var(--change); }
      .painel h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; }
      .modos { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
      .modo { position: relative; display: grid; grid-template-columns: auto 1fr; align-content: start; gap: 4px 12px; padding: 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--page-bg); text-align: left; cursor: pointer; }
      .modo:hover { background: var(--hover); }
      .modo svg { grid-row: span 2; width: 22px; height: 22px; color: var(--bar-muted); }
      .modo b { font-size: 14px; }
      .modo span { color: var(--bar-muted); font-size: 12.5px; }
      .modo kbd { position: absolute; top: 10px; right: 12px; font: 11px var(--mono); color: var(--bar-muted); }
      .modo.sugerido { border: 2px solid var(--accent); padding: 13px; }
      .modo.sugerido svg { color: var(--accent); }
      .modo em { grid-column: 2; font-style: normal; font-size: 11.5px; font-weight: 600; color: var(--accent); }
      .pf { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--border); color: var(--bar-muted); font-size: 12.5px; }
      .pf select { height: 28px; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--page-bg); color: var(--bar-fg); font: inherit; }
      @media (max-width: 700px) { .views, .pane, .painel { padding-left: 16px; padding-right: 16px; } }
      @media (prefers-reduced-motion: no-preference) {
        .ib, .btn { transition: background-color .15s, color .15s; }
        .regua .rc { transition: opacity .4s ease-out; }
        .balao { animation: pulsar 1.2s ease-out 3; }
      }
      .arquivos { display: flex; align-items: flex-end; gap: 2px; padding: 4px 8px 0; background: var(--bar-bg); border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
      .arquivos [role="tablist"] { display: flex; gap: 2px; min-width: 0; }
      .arquivos .arq { display: flex; align-items: center; max-width: 220px; border: 1px solid transparent; border-bottom: 0; border-radius: 6px 6px 0 0; color: var(--bar-muted); }
      .arquivos .arq:hover { background: var(--hover); }
      .arquivos .arq:has([aria-selected="true"]) { background: var(--page-bg); border-color: var(--border); color: var(--bar-fg); margin-bottom: -1px; padding-bottom: 1px; }
      .arquivos [role="tab"] { min-width: 0; padding: 5px 4px 5px 10px; border: 0; background: none; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
      .arquivos [role="tab"][aria-selected="true"] { font-weight: 600; }
      .arquivos .arq .ib { width: 22px; height: 22px; margin-right: 4px; }
      .arquivos .arq .ib svg.i { width: 13px; height: 13px; }
      .arquivos > .ib { margin: 0 0 3px 2px; flex: none; }
      .sem-arquivo { flex: 1; display: grid; place-content: center; justify-items: center; gap: 10px; padding: 24px; text-align: center; color: var(--bar-muted); }
      .sem-arquivo h1 { margin: 0; font-size: 18px; color: var(--bar-fg); }
      .sem-arquivo p { margin: 0; max-width: 42ch; }
      .soltar { position: fixed; inset: 8px; z-index: 50; display: grid; place-content: center; border: 2px dashed var(--accent); border-radius: 12px; background: color-mix(in srgb, var(--accent) 12%, color-mix(in srgb, var(--page-bg) 85%, transparent)); color: var(--accent); font-size: 16px; font-weight: 600; pointer-events: none; }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
      <symbol id="copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
      <symbol id="braces" viewBox="0 0 24 24"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1"/><path d="M16 21h1a2 2 0 0 0 2-2v-5a2 2 0 0 1 2-2 2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"/></symbol>
      <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></symbol>
      <symbol id="x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
      <symbol id="check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="home" viewBox="0 0 24 24"><path d="M5 12H3l9-9 9 9h-2"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/><path d="M9 21v-6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v6"/></symbol>
      <symbol id="binary-tree" viewBox="0 0 24 24"><path d="M6 20a2 2 0 1 0-4 0 2 2 0 0 0 4 0z"/><path d="M16 4a2 2 0 1 0-4 0 2 2 0 0 0 4 0z"/><path d="M16 20a2 2 0 1 0-4 0 2 2 0 0 0 4 0z"/><path d="M11 12a2 2 0 1 0-4 0 2 2 0 0 0 4 0z"/><path d="M21 12a2 2 0 1 0-4 0 2 2 0 0 0 4 0z"/><path d="m5.058 18.306 2.88-4.606"/><path d="m10.061 10.303 2.877-4.604"/><path d="m10.065 13.705 2.876 4.6"/><path d="m15.063 5.7 2.881 4.61"/></symbol>
      <symbol id="file-text" viewBox="0 0 24 24"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/><path d="M9 9h1"/><path d="M9 13h6"/><path d="M9 17h6"/></symbol>
      <symbol id="table" viewBox="0 0 24 24"><path d="M3 5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5z"/><path d="M3 10h18"/><path d="M10 3v18"/></symbol>
      <symbol id="alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
    </svg>
    <header class="top">
      <div class="side"><button class="btn" id="inicio" type="button" aria-keyshortcuts="Meta+0 Control+0" disabled><svg class="i"><use href="#home"/></svg><span>Início</span></button><span id="status" class="status" role="status" aria-live="polite"></span></div>
      <div class="name"><span id="nome"></span><span class="faixa" id="faixa"></span></div>
      <div class="side end">
        <button class="ib" id="tema" type="button" aria-label="Alternar tema claro e escuro"><svg class="i"><use href="#moon"/></svg></button>
        <button class="btn" id="abrir" type="button">Abrir…</button>
      </div>
    </header>
    <div class="arquivos" id="arquivos">
      <div role="tablist" id="arquivos-lista" aria-label="Arquivos abertos"></div>
      <button class="ib" id="nova-aba" type="button" aria-keyshortcuts="Meta+T Control+T" aria-label="Nova aba"><svg class="i"><use href="#plus"/></svg></button>
    </div>
    <section class="sem-arquivo" id="sem-arquivo" role="tabpanel" hidden>
      <svg class="i" style="width:32px;height:32px" aria-hidden="true"><use href="#braces"/></svg>
      <h1 id="sem-arquivo-titulo"></h1>
      <p id="sem-arquivo-dica"></p>
      <button class="btn" id="sem-arquivo-abrir" type="button"></button>
    </section>
    <div class="soltar" id="soltar" hidden></div>
    <main id="area" role="tabpanel">
      <div class="views" role="tablist" id="abas" aria-label="Valores">
        <button role="tab" aria-selected="true" aria-controls="arvore" type="button" id="aba-arvore" aria-keyshortcuts="Alt+Meta+1 Alt+Control+1">Árvore<kbd>⌥⌘1</kbd></button>
        <button role="tab" aria-selected="false" aria-controls="texto" type="button" id="aba-texto" tabindex="-1" aria-keyshortcuts="Alt+Meta+2 Alt+Control+2">Texto<kbd>⌥⌘2</kbd></button>
      </div>
      <section class="painel" id="painel" aria-labelledby="painel-nome" hidden>
        <div>
          <header class="pc">
            <span class="pi"><svg class="i"><use href="#braces"/></svg></span>
            <div><h1 id="painel-nome"></h1><p id="painel-sub"></p></div>
            <span class="selo" id="painel-selo" role="status" aria-live="polite"></span>
          </header>
          <dl class="indic" id="painel-indic"></dl>
          <h2 id="painel-pergunta">O que você quer fazer?</h2>
          <div class="modos" id="painel-modos" role="group" aria-labelledby="painel-pergunta"></div>
          <footer class="pf"><label for="painel-pref" id="painel-rotulo">Ao abrir um arquivo</label><select id="painel-pref"></select></footer>
        </div>
      </section>
      <div class="pane" id="conteudo">
        <div class="tools barra">
          <form class="busca" id="busca" role="search">
            <div class="campo">
              <input type="search" autocomplete="off" spellcheck="false" aria-keyshortcuts="Meta+F Control+F" />
              <button class="ib alt" type="button" data-caixa aria-pressed="false">Aa</button>
              <button class="ib alt" type="button" data-regex aria-pressed="false">.*</button>
            </div>
            <span class="info" role="status" aria-live="polite"></span>
            <button class="ib" type="button" data-anterior aria-keyshortcuts="Meta+Shift+G Control+Shift+G" disabled><svg class="i rot180"><use href="#chev"/></svg></button>
            <button class="ib" type="button" data-proximo aria-keyshortcuts="Meta+G Control+G" disabled><svg class="i"><use href="#chev"/></svg></button>
          </form>
          <form class="busca consulta" id="consulta">
            <div class="campo">
              <input type="text" autocomplete="off" spellcheck="false" aria-keyshortcuts="Meta+J Control+J" />
            </div>
            <span class="info" role="status" aria-live="polite"></span>
            <button class="btn" type="button" data-cancelar hidden></button>
            <button class="btn" type="button" data-voltar hidden></button>
          </form>
        </div>
        <div class="tools">
          <form id="ir">
            <label for="linha" id="rotulo-linha">Ir para linha</label>
            <input id="linha" type="number" min="1" step="1" inputmode="numeric" autocomplete="off" />
          </form>
          <ol class="crumbs" id="migalhas" aria-label="Caminho do nó selecionado"></ol>
          <div class="legenda" id="legenda" hidden></div>
          <div class="acts">
            <button class="btn" id="ver-formatado" type="button" disabled><svg class="i"><use href="#braces"/></svg><span>Ver formatado</span></button>
            <button class="btn" id="copiar" type="button" aria-keyshortcuts="Meta+Shift+C Control+Shift+C" disabled><svg class="i"><use href="#copy"/></svg><span>Copiar caminho</span></button>
          </div>
        </div>
        <div class="vista">
        <div class="tree" id="arvore" role="tree" tabindex="0" aria-label="Valores do arquivo">
          <div class="rows" id="linhas" role="presentation"></div>
          <div class="alto" id="alto"></div>
        </div>
        <div class="tree texto" id="texto" role="listbox" tabindex="0" aria-label="Texto do arquivo" hidden>
          <div class="rows" id="texto-linhas" role="presentation"></div>
          <div class="alto" id="texto-alto"></div>
        </div>
        <div class="regua" id="regua" role="slider" tabindex="0" aria-orientation="vertical" aria-valuemin="1" hidden></div>
        </div>
      </div>
    </main>
    <div class="menu" id="menu" role="menu" hidden>
      <button type="button" role="menuitem" tabindex="-1" data-formato="jq"><span></span><kbd>⇧⌘C</kbd></button>
      <button type="button" role="menuitem" tabindex="-1" data-formato="jsonpath"><span></span></button>
      <button type="button" role="menuitem" tabindex="-1" data-formato="pointer"><span></span></button>
      <button type="button" role="menuitem" tabindex="-1" data-formato="valor"><span></span><kbd>⌘C</kbd></button>
    </div>
    <dialog id="formatado" aria-labelledby="formatado-titulo">
      <header><h2 id="formatado-titulo"></h2><button class="ib" id="formatado-fechar" type="button" aria-label="Fechar"><svg class="i"><use href="#x"/></svg></button></header>
      <pre id="formatado-texto" tabindex="0"></pre>
    </dialog>
  </body>
</html>
