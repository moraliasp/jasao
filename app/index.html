<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <script type="module" src="/src/main.ts"></script>
    <style>
      /* Tokens do mockup aprovado (docs/mockup-nativo.html): fonte e cores de sistema de cada OS.
         `data-os` (mac/win/linux) vem do navegador em main.ts; os nomes antigos (--bar-*, --page-bg…) são apelidos. */
      :root {
        --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
        --win: #ffffff; --chrome: #f6f6f6; --side: #f5f5f7; --line: rgba(0,0,0,.09); --line-strong: rgba(0,0,0,.14);
        --fg: #1d1d1f; --fg2: #6e6e73; --fg3: #76767b; --hover: rgba(0,0,0,.05);
        --accent: #007aff; --sel: rgba(0,122,255,.12); --seg: rgba(0,0,0,.06); --seg-on: #ffffff; --field: rgba(0,0,0,.05);
        --change: #9a6700; --ok: #1a7f37; --del: #cf222e;
        /* Régua do micronavegador: neutro, as 4 variantes mais frequentes e "outros". */
        --rg-neutro: #eaeef2; --rg-1: #1b7c83; --rg-2: #8250df; --rg-3: #bc4c00; --rg-4: #bf3989; --rg-outros: #8c959f;
        --bar-bg: var(--chrome); --bar-fg: var(--fg); --bar-muted: var(--fg2); --border: var(--line-strong); --page-bg: var(--win);
        color-scheme: light;
        font-family: var(--sans);
      }
      :root[data-theme="dark"] {
        --win: #1e1e1e; --chrome: #2a2a2a; --side: #252525; --line: rgba(255,255,255,.08); --line-strong: rgba(255,255,255,.13);
        --fg: #f5f5f7; --fg2: #a1a1a6; --fg3: #8e8e93; --hover: rgba(255,255,255,.06);
        --accent: #0a84ff; --sel: rgba(10,132,255,.22); --seg: rgba(255,255,255,.08); --seg-on: #5a5a5c; --field: rgba(255,255,255,.07);
        --change: #d29922; --ok: #3fb950; --del: #f85149;
        --rg-neutro: #21262d; --rg-1: #39c5cf; --rg-2: #a371f7; --rg-3: #f0883e; --rg-4: #db61a2; --rg-outros: #6e7681;
        color-scheme: dark;
      }
      :root[data-os="win"] { --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; --mono: "Cascadia Mono", Consolas, ui-monospace, monospace; }
      :root[data-os="win"]:not([data-theme="dark"]) { --chrome: #f3f3f3; --side: #f9f9f9; --accent: #0067c0; --sel: rgba(0,103,192,.10); }
      :root[data-os="linux"] { --sans: Cantarell, "Noto Sans", Ubuntu, system-ui, sans-serif; --mono: "DejaVu Sans Mono", "Noto Sans Mono", ui-monospace, monospace; }
      :root[data-os="linux"][data-theme="dark"] { --chrome: #303030; --side: #2a2a2a; --accent: #78aeed; --sel: rgba(53,132,228,.30); --seg-on: rgba(255,255,255,.18); }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body { display: flex; flex-direction: column; background: var(--page-bg); color: var(--bar-fg); font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased; scrollbar-color: var(--border) transparent; }
      ::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 4px; }
      button, input { font: inherit; color: inherit; }
      svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

      /* Barra unificada: título e meta, vistas, busca, jq e inspetor. No Mac a janela não tem título (Overlay):
         os semáforos ficam sobre os 84px da esquerda e a barra arrasta a janela (data-tauri-drag-region). */
      .top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; flex: none; height: 52px; padding: 0 12px 0 16px; background: var(--chrome); border-bottom: 1px solid var(--line); -webkit-user-select: none; user-select: none; }
      :root[data-os="mac"] .top { padding-left: 84px; }
      .top .side { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .top .side.end { justify-content: flex-end; }
      .ttl { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
      .ttl b { overflow: hidden; font-size: 13px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
      .ttl span { overflow: hidden; font-size: 11px; color: var(--fg2); text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
      /* Windows e Linux: moldura nativa com o título; a barra fica em 44px só com as vistas, e a meta desce para a status bar. */
      :root:not([data-os="mac"]) .top { grid-template-columns: 0 1fr auto; height: 44px; padding-left: 8px; }
      :root:not([data-os="mac"]) .ttl { display: none; }
      :root:not([data-os="mac"]) .seg { justify-self: start; }
      :root[data-os="mac"] #mais, :root[data-os="mac"] .so-fora-mac { display: none; }
      .seg { display: flex; gap: 1px; padding: 2px; border-radius: 7px; background: var(--seg); }
      .seg button { padding: 5px 11px; border: 0; border-radius: 5px; background: none; color: var(--fg); font: 12px/1 var(--sans); white-space: nowrap; }
      .seg button[aria-selected="true"] { background: var(--seg-on); box-shadow: 0 .5px 1.5px rgba(0,0,0,.18), 0 0 0 .5px rgba(0,0,0,.04); font-weight: 500; }
      :root[data-os="win"] .seg { gap: 2px; padding: 0; background: none; }
      :root[data-os="win"] .seg button { position: relative; padding: 7px 10px; border-radius: 4px; color: var(--fg2); font-size: 13px; }
      :root[data-os="win"] .seg button[aria-selected="true"] { background: var(--hover); box-shadow: none; color: var(--fg); font-weight: 600; }
      :root[data-os="win"] .seg button[aria-selected="true"]::after { content: ""; position: absolute; left: 50%; bottom: 2px; width: 16px; height: 3px; margin-left: -8px; border-radius: 2px; background: var(--accent); }
      :root[data-os="linux"] .seg { padding: 3px; border-radius: 9px; }
      :root[data-os="linux"] .seg button { padding: 5px 12px; border-radius: 6px; }
      :root[data-os="linux"] .seg button[aria-selected="true"] { box-shadow: none; font-weight: 700; }
      .top .ib { width: 30px; }
      .top .ib[aria-pressed="true"] { background: var(--sel); color: var(--accent); }
      .ib { display: grid; place-items: center; width: 28px; height: 28px; border: 0; border-radius: 6px; background: none; color: var(--bar-muted); cursor: pointer; }
      .ib:hover { background: var(--hover); color: var(--bar-fg); }
      .btn { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border: 0; border-radius: 6px; background: var(--win); box-shadow: 0 0 0 .5px var(--line-strong), 0 .5px 1px rgba(0,0,0,.08); font-size: 12px; cursor: pointer; white-space: nowrap; }
      .btn:hover { background: color-mix(in srgb, var(--win) 92%, var(--fg)); }
      .btn:active { transform: translateY(1px); }
      .btn:disabled { opacity: .5; cursor: default; }
      .btn.pri { background: var(--accent); box-shadow: none; color: #fff; }
      .btn.pri:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }
      :root[data-os="win"] .ib, :root[data-os="win"] .btn { border-radius: 4px; }
      /* Busca: contagem e ↑↓ dentro do campo; Aa e .* aparecem com o foco (ou ligados). */
      .search { display: flex; align-items: center; gap: 4px; width: 230px; height: 28px; padding: 0 3px 0 8px; border-radius: 7px; background: var(--field); color: var(--fg3); }
      .search:focus-within { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent), inset 0 0 0 1px var(--accent); }
      :root[data-os="win"] .search { width: 250px; border-radius: 4px; background: var(--win); box-shadow: inset 0 0 0 1px var(--line-strong); }
      :root[data-os="linux"] .search { border-radius: 6px; }
      .search input { flex: 1; min-width: 0; height: 26px; padding: 0; border: 0; background: none; color: var(--fg); font-size: 13px; }
      .search input::placeholder { color: var(--fg3); }
      .search input:focus-visible { outline: 0; }
      .search input::-webkit-search-cancel-button { display: none; }
      .search .info { overflow: hidden; max-width: 11ch; font-size: 11px; color: var(--fg2); text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
      .search .info:empty, .search .ib:disabled { display: none; }
      .search .ib { width: 20px; height: 22px; border-radius: 4px; }
      .search .alt { display: none; width: 22px; font: 11px/1 var(--mono); }
      .search:focus-within .alt, .search .alt[aria-pressed="true"] { display: grid; }
      .alt[aria-pressed="true"] { background: var(--sel); color: var(--accent); }

      main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
      .corpo { flex: 1; display: flex; min-height: 0; }
      .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
      .pane .tree { border: 0; border-radius: 0; }
      .crumbs { display: flex; align-items: center; min-width: 0; margin: 0; padding: 0; list-style: none; overflow: hidden; font: 11px/1.5 var(--mono); color: var(--fg); white-space: nowrap; }
      .crumbs li + li::before { content: "›"; margin: 0 5px; color: var(--fg3); }
      /* Barra do filtro jq: só com ⌘J, o botão do funil ou um filtro ativo. */
      .scope { flex: none; display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--win); font-size: 12px; color: var(--fg2); }
      .scope .chip { display: flex; flex: 0 1 520px; align-items: center; gap: 2px; min-width: 160px; height: 22px; padding: 0 2px 0 8px; border-radius: 6px; background: var(--sel); color: var(--fg); }
      .scope .chip:focus-within { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent); }
      .scope .chip:has(input[aria-invalid="true"]) { box-shadow: inset 0 0 0 1px var(--del); }
      .scope .chip > svg.i { width: 12px; height: 12px; color: var(--fg2); }
      .scope input { flex: 1; min-width: 0; height: 22px; padding: 0 0 0 4px; border: 0; background: none; color: var(--fg); font: 12px var(--mono); }
      .scope input:focus-visible { outline: 0; }
      .scope .ib { width: 20px; height: 20px; border-radius: 4px; }
      .scope .ib svg.i { width: 12px; height: 12px; }
      .scope .alt { width: auto; padding: 0 4px; font: 11px/1 var(--mono); }
      .scope .info { white-space: nowrap; font-variant-numeric: tabular-nums; }
      .scope .btn { height: 22px; }
      .scope .lk { margin-left: auto; }
      .info.err { color: var(--del); }
      .rot180 { transform: rotate(180deg); }
      .ac { background: color-mix(in srgb, var(--change) 28%, transparent); color: inherit; border-radius: 2px; }
      .menu { position: fixed; z-index: 20; min-width: 210px; padding: 4px; border: 1px solid var(--border); border-radius: 8px; background: var(--page-bg); box-shadow: 0 8px 24px rgba(0,0,0,0.18); }
      .menu[hidden] { display: none; }
      .menu button { display: flex; justify-content: space-between; gap: 16px; width: 100%; height: 28px; padding: 0 10px; border: 0; border-radius: 4px; background: none; font-size: 13px; text-align: left; cursor: pointer; }
      .menu button:hover, .menu button:focus-visible { background: color-mix(in srgb, var(--accent) 14%, transparent); outline: 0; }
      .menu kbd { color: var(--bar-muted); font: inherit; }
      .ac.at { background: color-mix(in srgb, var(--change) 60%, transparent); box-shadow: 0 0 0 1px var(--change); }
      /* Status bar: caminho, tempo de abertura, avisos da abertura e, à direita, por que a vista foi sugerida. */
      .sb { flex: none; display: flex; align-items: center; gap: 14px; height: 26px; padding: 0 12px 0 16px; overflow: hidden; border-top: 1px solid var(--line); background: var(--chrome); font-size: 11px; color: var(--fg2); white-space: nowrap; font-variant-numeric: tabular-nums; }
      .sb .sp { margin-left: auto; }
      .sb .btn { height: 20px; padding: 0 8px; font-size: 11px; }
      .sb .ib { width: 22px; height: 20px; border-radius: 4px; }
      .sb .ib svg.i { width: 13px; height: 13px; }
      .sb form { display: flex; align-items: center; gap: 6px; }
      .sb input { width: 9ch; height: 18px; padding: 0 6px; border: 0; border-radius: 4px; background: var(--field); font-size: 11px; font-variant-numeric: tabular-nums; }
      .sug { display: inline-flex; align-items: center; gap: 6px; }
      .sug svg.i { width: 12px; height: 12px; color: var(--accent); }
      .status { min-width: 0; overflow: hidden; text-overflow: ellipsis; } /* rótulo longo de filtro não invade a barra */

      /* Árvore virtualizada: só as linhas visíveis existem no DOM. */
      .tree { position: relative; flex: 1; min-height: 0; overflow: auto; border: 1px solid var(--border); border-radius: 6px; font: 12.5px/1.5 var(--mono); }
      .tree:focus-visible { outline-offset: -2px; border-radius: 6px; }
      .alto { width: 1px; }
      .rows { position: sticky; top: 0; overflow: hidden; }
      .row { display: flex; align-items: center; gap: 8px; height: 26px; padding-right: 8px; white-space: nowrap; cursor: default; }
      .row:hover { background: var(--hover); }
      .row[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); }
      .tree:focus-visible .row[aria-selected="true"] { box-shadow: inset 2px 0 var(--accent); }
      .row .tg, .row .sp { display: grid; place-items: center; width: 20px; height: 20px; flex: none; color: var(--bar-muted); border-radius: 4px; }
      .row .tg:hover { background: var(--hover); color: var(--bar-fg); }
      .row .tg svg { width: 13px; height: 13px; }
      .row .key { color: var(--bar-muted); }
      .row .val { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      /* Texto do arquivo: cada chave/valor isolado (direção bidi não vaza) e invisíveis com o código à vista. */
      .row .key, .row .val, .tl .tx span, .estr .ec, .estr .et, .crumbs li { unicode-bidi: isolate; }
      .inv { unicode-bidi: isolate; }
      .inv::before { content: attr(data-u); margin: 0 1px; padding: 0 2px; border-radius: 3px; font: 9px/1 var(--mono); vertical-align: 1px; color: var(--del); background: color-mix(in srgb, var(--del) 12%, transparent); }
      .row .dim { color: var(--bar-muted); }
      .row .err { color: var(--del); display: inline-flex; gap: 6px; align-items: center; flex: none; }
      .row .err svg { width: 13px; height: 13px; }
      .row .cp { margin-left: auto; width: 22px; height: 22px; opacity: 0; }
      .row .cp svg { width: 13px; height: 13px; }
      .row:hover .cp { opacity: 1; }
      @media (hover: none) { .row .cp { opacity: 1; } }
      /* Valores inteligentes: selo na linha e painel do valor selecionado. */
      .smart { display: inline-flex; align-items: center; gap: 4px; flex: none; padding: 0 6px; height: 18px; border-radius: 9px; font: 11px var(--mono); color: var(--bar-muted); background: var(--hover); }
      .smart .i { width: 12px; height: 12px; }
      .sw { width: 12px; height: 12px; border-radius: 3px; box-shadow: inset 0 0 0 1px var(--border); }
      .lk { display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none; font: inherit; color: var(--accent); cursor: pointer; }
      .lk:hover span, .lk:focus-visible span { text-decoration: underline; }
      .lk .i { width: 12px; height: 12px; flex: none; }
      .detalhe { flex: none; max-height: 40%; overflow: auto; padding: 8px 16px; border-top: 1px solid var(--line); font: 12.5px/1.5 var(--mono); }
      .detalhe .rot { font: 600 11px var(--mono); color: var(--bar-muted); text-transform: uppercase; letter-spacing: .04em; margin: 4px 0; }
      .detalhe pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; unicode-bidi: isolate; }
      .detalhe .lk { word-break: break-all; text-align: left; }
      .detalhe .smart { height: 22px; font-size: 12.5px; color: inherit; }
      .detalhe .smart .sw { width: 16px; height: 16px; }
      .detalhe figure { margin: 0; }
      .detalhe img { display: block; min-width: 64px; max-width: 100%; max-height: 240px; object-fit: contain; image-rendering: pixelated; background: repeating-conic-gradient(var(--hover) 0 25%, transparent 0 50%) 0 0/12px 12px; }
      .detalhe figcaption { color: var(--bar-muted); font-size: 11px; }
      .detalhe .par { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
      [hidden] { display: none !important; }

      /* Texto: uma linha crua por registro, também virtualizada. */
      .texto .rows { overflow-x: visible; overflow-y: clip; width: max-content; min-width: 100%; }
      .tl { display: flex; height: 20px; line-height: 20px; white-space: pre; cursor: text; }
      .tl[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 7%, transparent); }
      .tl .nl { position: sticky; left: 0; flex: none; box-sizing: content-box; padding: 0 12px 0 16px; text-align: right; color: var(--bar-muted); background: var(--page-bg); user-select: none; }
      .tl[aria-selected="true"] .nl { color: var(--bar-fg); box-shadow: inset 2px 0 var(--accent); }
      .tl .tx { padding-right: 16px; }
      .tl .k { color: var(--accent); }
      .tl .s { color: var(--ok); }
      .tl .n, .tl .l { color: var(--change); }
      .tl .p { color: var(--bar-muted); }
      .tl .hl { background: color-mix(in srgb, var(--accent) 22%, transparent); }
      .estr .eres { position: sticky; top: 0; margin: 0; padding: 6px 16px; background: var(--page-bg); border-bottom: 1px solid var(--border); color: var(--bar-muted); font: 12px/1.5 system-ui, sans-serif; }
      .estr .row { gap: 16px; }
      .estr .ec { flex: none; width: 34%; overflow: hidden; text-overflow: ellipsis; }
      .estr .et { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--change); }
      .estr .ep { flex: none; color: var(--bar-muted); font-variant-numeric: tabular-nums; }
      .estr .ep.op { color: var(--bar-fg); }
      .estr .ea { margin-left: 6px; padding: 0 5px; border-radius: 3px; background: color-mix(in srgb, var(--change) 14%, transparent); color: var(--bar-fg); font: 11px/1.6 system-ui, sans-serif; }
      .eperf { flex: none; width: min(320px, 34%); max-height: none; border-top: 0; border-left: 1px solid var(--line); }
      .eperf p { margin: 2px 0 6px; }
      .eperf .pm { color: var(--bar-muted); font-family: system-ui, sans-serif; text-transform: none; letter-spacing: 0; }
      /* Faixas e valores comuns são botões: filtram a Tabela. */
      .eperf .fx, .eperf .fc { width: 100%; padding: 1px 2px; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
      .eperf .fx:hover, .eperf .fc:hover { background: var(--hover); }
      .eperf .fx { display: grid; grid-template-columns: 9em 1fr auto; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }
      .eperf .fx i { height: 8px; border-radius: 2px; background: var(--accent); }
      .eperf .cm { margin: 0 0 6px; padding-left: 20px; }
      .eperf .fc { display: flex; justify-content: space-between; gap: 8px; }
      .eperf .fc span:first-child { min-width: 0; overflow-wrap: anywhere; unicode-bidi: isolate; }
      .eperf .fc span:last-child { flex: none; color: var(--bar-muted); font-variant-numeric: tabular-nums; }
      .eperf .pl { display: flex; flex-wrap: wrap; gap: 4px; max-height: 8em; overflow: auto; }
      .eperf .lk { padding: 0 4px; border: 1px solid var(--border); border-radius: 3px; background: none; color: inherit; font: inherit; cursor: pointer; }
      .vista:has(.estr:not([hidden]), .exp:not([hidden])) .regua { display: none; }
      /* Tabela: grade virtual; cabeçalho e colunas fixadas grudam, o resto rola. */
      .tabw { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 0; }
      .tbar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 6px 16px 0; color: var(--bar-muted); font: 12px/1.5 system-ui, sans-serif; }
      .tocultas { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; }
      .tocultas .chip, .tfiltro .chip { display: inline-flex; align-items: center; gap: 4px; max-width: 220px; padding: 1px 6px; border: 1px solid var(--border); border-radius: 10px; background: none; color: var(--bar-fg); font: 11.5px var(--mono); overflow: hidden; white-space: nowrap; cursor: pointer; unicode-bidi: isolate; }
      .tfiltro .chip { cursor: default; max-width: 420px; }
      .tfiltro .chip .tx { overflow: hidden; text-overflow: ellipsis; min-width: 0; } /* rótulo longo encolhe; o × fica */
      .tfiltro .chip .ib { padding: 0; border: 0; background: none; color: inherit; cursor: pointer; display: inline-flex; }
      .tfiltro, .tordem { display: inline-flex; align-items: center; gap: 8px; }
      .tfiltro progress { width: 120px; }
      .tfiltro .btn { padding: 1px 8px; }
      .tocultas .chip svg, .tfiltro .chip svg { width: 11px; height: 11px; flex: none; }
      .tordem progress { width: 120px; }
      .tordem .btn { padding: 1px 8px; }
      .grade .rows { overflow-x: visible; overflow-y: clip; width: max-content; min-width: 100%; }
      .grade .tr { display: grid; grid-template-columns: var(--cols); height: 26px; }
      .grade .thead { position: relative; z-index: 2; background: var(--page-bg); border-bottom: 1px solid var(--border); }
      .grade .thead .tr { height: 43px; }
      .grade .tbody { overflow-y: clip; }
      .grade .tbody .tr:hover > * { background-color: var(--hover); }
      .grade .th, .grade .td { min-width: 0; padding: 0 8px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; line-height: 26px; border-right: 1px solid color-mix(in srgb, var(--border) 60%, transparent); background: var(--page-bg); cursor: default; }
      .grade .th { position: relative; display: flex; flex-direction: column; justify-content: center; line-height: 1.35; font-weight: 600; }

    <header class="top" data-tauri-drag-region>
      <div class="side" data-tauri-drag-region><div class="ttl" data-tauri-drag-region><b id="nome" data-tauri-drag-region></b><span id="meta" data-tauri-drag-region></span></div></div>
      <div class="seg" role="tablist" id="abas" aria-label="Valores">
          <button role="tab" aria-selected="true" aria-controls="arvore" type="button" id="aba-arvore" aria-keyshortcuts="Alt+Meta+1 Alt+Control+1" data-tecla="⌥⌘1">Árvore</button>
          <button role="tab" aria-selected="false" aria-controls="texto" type="button" id="aba-texto" tabindex="-1" aria-keyshortcuts="Alt+Meta+2 Alt+Control+2" data-tecla="⌥⌘2">Texto</button>
          <button role="tab" aria-selected="false" aria-controls="estrutura" type="button" id="aba-estrutura" tabindex="-1" aria-keyshortcuts="Alt+Meta+3 Alt+Control+3" data-tecla="⌥⌘3">Estrutura</button>
          <button role="tab" aria-selected="false" aria-controls="tabela" type="button" id="aba-tabela" tabindex="-1" aria-keyshortcuts="Alt+Meta+4 Alt+Control+4" data-tecla="⌥⌘4">Tabela</button>
          <button role="tab" aria-selected="false" aria-controls="exportar" type="button" id="aba-exportar" tabindex="-1" aria-keyshortcuts="Alt+Meta+5 Alt+Control+5" data-tecla="⌥⌘5">Exportar</button>
          <button role="tab" aria-selected="false" aria-controls="diff" type="button" id="aba-diff" tabindex="-1" aria-keyshortcuts="Alt+Meta+6 Alt+Control+6" data-tecla="⌥⌘6">Diff</button>
      </div>
      <div class="side end" data-tauri-drag-region>
        <form class="search" id="busca" role="search">
          <svg class="i" aria-hidden="true"><use href="#mag"/></svg>
          <input type="search" autocomplete="off" spellcheck="false" aria-keyshortcuts="Meta+F Control+F" />
          <span class="info" role="status" aria-live="polite"></span>
          <button class="ib alt" type="button" data-caixa aria-pressed="false">Aa</button>
          <button class="ib alt" type="button" data-regex aria-pressed="false">.*</button>
          <button class="ib" type="button" data-anterior aria-keyshortcuts="Meta+Shift+G Control+Shift+G" disabled><svg class="i"><use href="#up16"/></svg></button>
          <button class="ib" type="button" data-proximo aria-keyshortcuts="Meta+G Control+G" disabled><svg class="i"><use href="#down16"/></svg></button>
        </form>
        <button class="ib" id="jq" type="button" aria-pressed="false" aria-keyshortcuts="Meta+J Control+J"><svg class="i"><use href="#funnel"/></svg></button>
        <button class="ib" id="inspetor" type="button" aria-pressed="true" aria-controls="painel" aria-keyshortcuts="Alt+Meta+I Alt+Control+I"><svg class="i"><use href="#side"/></svg></button>
        <button class="ib" id="mais" type="button" aria-haspopup="menu" aria-controls="acoes"><svg class="i"><use href="#more"/></svg></button>
      </div>
    </header>
    <div class="menu" id="acoes" role="menu" hidden>
      <button type="button" role="menuitem" tabindex="-1" id="abrir"></button>
      <button type="button" role="menuitem" tabindex="-1" id="abrir-url"></button>
      <button type="button" role="menuitem" tabindex="-1" id="ir-menu"></button>
      <button type="button" role="menuitem" tabindex="-1" id="tema"></button>
    </div>
    <div class="arquivos" id="arquivos">
      <div role="tablist" id="arquivos-lista" aria-label="Arquivos abertos"></div>
      <button class="ib" id="nova-aba" type="button" aria-keyshortcuts="Meta+T Control+T" aria-label="Nova aba"><svg class="i"><use href="#plus"/></svg></button>
    </div>
    <section class="sem-arquivo" id="sem-arquivo" role="tabpanel" hidden>
      <svg class="i" style="width:32px;height:32px" aria-hidden="true"><use href="#braces"/></svg>
      <h1 id="sem-arquivo-titulo"></h1>
      <p id="sem-arquivo-dica"></p>
      <div><button class="btn" id="sem-arquivo-abrir" type="button"></button> <button class="btn" id="sem-arquivo-url" type="button"></button></div>
      <nav class="recentes" id="recentes" hidden></nav>
    </section>
    <div class="soltar" id="soltar" hidden></div>
    <main id="area" role="tabpanel">
      <form class="scope" id="consulta" hidden>
        <div class="chip">
          <svg class="i" aria-hidden="true"><use href="#funnel"/></svg>
          <input type="text" autocomplete="off" spellcheck="false" list="filtros-salvos" aria-keyshortcuts="Meta+J Control+J" />
          <datalist id="filtros-salvos"></datalist>
          <button class="ib alt" type="button" data-salvar aria-pressed="false" disabled>★</button>
          <button class="ib alt" type="button" data-anonimizar aria-pressed="false">anon</button>
          <button class="ib" type="button" id="consulta-fechar"><svg class="i"><use href="#x16"/></svg></button>
        </div>
        <span class="info" role="status" aria-live="polite"></span>
        <button class="btn" type="button" data-cancelar hidden></button>
        <button class="btn" type="button" data-voltar hidden></button>
        <button class="btn" type="button" data-exportar="jsonl" hidden></button>
        <button class="btn" type="button" data-exportar="csv" hidden></button>
        <button class="lk" type="button" id="salvar-como-abrir"></button>
      </form>
      <div class="corpo">
      <div class="pane" id="conteudo">
        <div class="legenda" id="legenda" hidden></div>
        <div class="vista">
        <div class="tree" id="arvore" role="tree" tabindex="0" aria-label="Valores do arquivo">
          <div class="rows" id="linhas" role="presentation"></div>
          <div class="alto" id="alto"></div>
        </div>
        <div class="tree texto" id="texto" role="listbox" tabindex="0" aria-label="Texto do arquivo" hidden>
          <div class="rows" id="texto-linhas" role="presentation"></div>
          <div class="alto" id="texto-alto"></div>
        </div>
        <div class="tree estr" id="estrutura" role="listbox" tabindex="0" aria-label="Estrutura inferida do arquivo" aria-describedby="estrutura-resumo" hidden>
          <p class="eres" id="estrutura-resumo" role="status" aria-live="polite"></p>
          <div id="estrutura-linhas" role="presentation"></div>
        </div>
        <aside class="detalhe eperf" id="estrutura-perfil" aria-label="Estatísticas do caminho" aria-live="polite" hidden></aside>
        <div class="tabw" id="tabela-vista" hidden>
          <div class="tbar">
            <span id="tabela-resumo" role="status" aria-live="polite"></span>
            <span class="tfiltro" id="tabela-filtro" role="status" aria-live="polite"></span>
            <span class="tocultas" id="tabela-ocultas"></span>
            <span class="tordem" id="tabela-ordem" role="status" aria-live="polite" hidden><progress max="100" value="0"></progress><span></span><button class="btn" type="button"></button></span>
          </div>
          <div class="tree grade" id="tabela" role="grid" tabindex="0" aria-describedby="tabela-resumo">
            <div class="rows" role="presentation"></div>
            <div class="alto"></div>
          </div>
        </div>
        <section class="tree exp" id="exportar" tabindex="-1" aria-label="Exportar a estrutura como Zod ou JSON Schema" hidden></section>
        <section class="tree exp dif" id="diff" tabindex="-1" aria-label="Comparar dois arquivos abertos" hidden></section>
        <div class="regua" id="regua" role="slider" tabindex="0" aria-orientation="vertical" aria-valuemin="1" hidden></div>
        </div>
        <section class="detalhe" id="detalhe" aria-label="Valor selecionado" aria-live="polite" hidden></section>
      </div>
      <aside class="insp" id="painel" aria-labelledby="painel-titulo">
        <h2 class="ih" id="painel-titulo"></h2>
        <p class="meta" id="painel-meta" role="status" aria-live="polite"></p>
        <section id="painel-laudo" aria-live="polite"></section>
        <footer class="pf"><label for="painel-pref" id="painel-rotulo">Ao abrir um arquivo</label><select id="painel-pref"></select></footer>
      </aside>
      </div>
    </main>
    <footer class="sb" id="barra-status">
      <ol class="crumbs" id="migalhas" aria-label="Caminho do nó selecionado"></ol>
      <span id="aberto-ms"></span>
      <span class="so-fora-mac" id="meta-st"></span>
      <span id="faixa"></span>
      <span id="status" class="status" role="status" aria-live="polite"></span>
      <button class="btn" id="cancelar-abertura" type="button" hidden></button><button class="btn" id="seguir" type="button" aria-pressed="false" hidden></button><button class="btn" id="novas" type="button" hidden></button>
      <form id="ir" hidden>
        <label for="linha" id="rotulo-linha">Ir para linha</label>
        <input id="linha" type="number" min="1" step="1" inputmode="numeric" autocomplete="off" />
      </form>
      <span class="sp"></span>
      <button class="ib" id="ver-formatado" type="button" disabled><svg class="i"><use href="#braces"/></svg></button>
      <button class="ib" id="copiar" type="button" aria-keyshortcuts="Meta+Shift+C Control+Shift+C" disabled><svg class="i"><use href="#copy"/></svg></button>
      <span class="sug" id="sugestao"></span>
    </footer>
    <div class="menu" id="menu" role="menu" hidden>
      <button type="button" role="menuitem" tabindex="-1" data-formato="jq"><span></span><kbd>⇧⌘C</kbd></button>
      <button type="button" role="menuitem" tabindex="-1" data-formato="jsonpath"><span></span></button>
      <button type="button" role="menuitem" tabindex="-1" data-formato="pointer"><span></span></button>
      <button type="button" role="menuitem" tabindex="-1" data-formato="valor"><span></span><kbd>⌘C</kbd></button>
    </div>
    <dialog id="salvar-como"></dialog>
    <dialog id="formatado" aria-labelledby="formatado-titulo">
      <header><h2 id="formatado-titulo"></h2><button class="ib" id="formatado-fechar" type="button" aria-label="Fechar"><svg class="i"><use href="#x"/></svg></button></header>
      <pre id="formatado-texto" tabindex="0"></pre>
    </dialog>
    <dialog id="url" aria-labelledby="url-titulo">
      <form id="url-form">
        <header><h2 id="url-titulo"></h2><button class="ib" id="url-fechar" type="button" aria-label="Fechar"><svg class="i"><use href="#x"/></svg></button></header>
        <label for="url-entrada" id="url-rotulo"></label>
        <textarea id="url-entrada" rows="4" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off"></textarea>
        <p id="url-dica"></p>
        <footer><button class="btn" id="url-baixar" type="submit"></button></footer>
      </form>
    </dialog>
  </body>
</html>
