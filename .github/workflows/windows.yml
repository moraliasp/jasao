name: Build Windows

# Instalador NSIS (.exe) para testar no Windows. Roda à mão (Actions → Run workflow) e no PR
# que mexe neste arquivo. Runner hospedado do GitHub: gasta minuto Windows (2×) da cota da org.
# Sem assinatura de código: o SmartScreen avisa ao abrir.

on:
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/windows.yml]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nsis:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml fixa a versão; o rustup do runner instala sozinho.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm tauri build --bundles nsis
        working-directory: app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jasao-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
