name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Runner auto-hospedado enquanto o repositório é privado (cota do Actions zerada).
# Sem rust-cache: ele limpa ~/.cargo/bin, o que estragaria a máquina do runner.
# Antes de tornar o repositório público, voltar para runners do GitHub.

jobs:
  rust:
    runs-on: [self-hosted, jasao-local]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml fixa a versão; o rustup do runner instala sozinho.
      # O app embute app/dist; o clippy do workspace precisa dele existir.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm build
        working-directory: app
      # Lógica de front sem navegador (node tira os tipos do .ts sozinho).
      - run: pnpm test
        working-directory: app
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Benchmark compila
        run: cargo bench -p nucleo --no-run

  app:
    runs-on: [self-hosted, jasao-local]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - name: Build do app (sem bundle)
        run: pnpm tauri build --no-bundle
        working-directory: app

  fuzz:
    runs-on: [self-hosted, jasao-local]
    env:
      # Versões fixas: nightly por data e cargo-fuzz exato (atualizar os dois juntos, aqui e em
      # scripts/gates.sh). Orçamento: ~300 s de fuzz no total, repartidos entre os alvos.
      NIGHTLY: nightly-2026-11-20
      FUZZ_SEG: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install "$NIGHTLY" --profile minimal
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz curto do índice de linhas
        working-directory: core/fuzz
        run: cargo +"$NIGHTLY" fuzz run indice_linhas --fuzz-dir . -- -max_total_time="$FUZZ_SEG"
      - name: Fuzz curto da descompactação
        working-directory: core/fuzz
        run: cargo +"$NIGHTLY" fuzz run compactado --fuzz-dir . -- -max_total_time="$FUZZ_SEG"
      - name: Fuzz curto da busca
        working-directory: core/fuzz
        run: cargo +"$NIGHTLY" fuzz run busca --fuzz-dir . -- -max_total_time="$FUZZ_SEG" -max_len=4096
      - name: Fuzz curto da consulta jq
        working-directory: core/fuzz
        run: cargo +"$NIGHTLY" fuzz run consulta --fuzz-dir . -- -max_total_time="$FUZZ_SEG" -max_len=4096
      - name: Fuzz curto das linhas inválidas
        working-directory: core/fuzz
        run: cargo +"$NIGHTLY" fuzz run erros --fuzz-dir . -- -max_total_time="$FUZZ_SEG" -max_len=4096
      - name: Fuzz curto da árvore
        working-directory: core/fuzz
        run: cargo +"$NIGHTLY" fuzz run arvore --fuzz-dir . -- -max_total_time="$FUZZ_SEG" -max_len=4096
      - name: Fuzz curto do registro formatado
        working-directory: core/fuzz
        run: cargo +"$NIGHTLY" fuzz run formatado --fuzz-dir . -- -max_total_time="$FUZZ_SEG" -max_len=4096
      - name: Fuzz curto da inferência de estrutura
        working-directory: core/fuzz
        run: cargo +"$NIGHTLY" fuzz run estrutura --fuzz-dir . -- -max_total_time="$FUZZ_SEG" -max_len=4096
      - name: Fuzz curto da régua
        working-directory: core/fuzz
        run: cargo +"$NIGHTLY" fuzz run regua --fuzz-dir . -- -max_total_time="$FUZZ_SEG" -max_len=4096
      - name: Fuzz curto do resumo do arquivo
        working-directory: core/fuzz
        run: cargo +"$NIGHTLY" fuzz run resumo --fuzz-dir . -- -max_total_time="$FUZZ_SEG" -max_len=4096
      - name: Fuzz curto da visão Texto
        working-directory: core/fuzz
        run: cargo +"$NIGHTLY" fuzz run texto --fuzz-dir . -- -max_total_time="$FUZZ_SEG" -max_len=4096
      - name: Fuzz curto do export Zod/Schema
        working-directory: core/fuzz
        run: cargo +"$NIGHTLY" fuzz run exportar --fuzz-dir . -- -max_total_time="$FUZZ_SEG" -max_len=4096
      - name: Fuzz curto do diff de estrutura
        working-directory: core/fuzz
        run: cargo +"$NIGHTLY" fuzz run diff --fuzz-dir . -- -max_total_time="$FUZZ_SEG" -max_len=4096
      - name: Fuzz curto da conversão de MessagePack
        working-directory: core/fuzz
        run: cargo +"$NIGHTLY" fuzz run formato_msgpack --fuzz-dir . -- -max_total_time="$FUZZ_SEG" -max_len=4096
      - name: Fuzz curto da conversão de CBOR
        working-directory: core/fuzz
        run: cargo +"$NIGHTLY" fuzz run formato_cbor --fuzz-dir . -- -max_total_time="$FUZZ_SEG" -max_len=4096
      - name: Fuzz curto da conversão de BSON
        working-directory: core/fuzz
        run: cargo +"$NIGHTLY" fuzz run formato_bson --fuzz-dir . -- -max_total_time="$FUZZ_SEG" -max_len=4096
      - name: Fuzz curto da conversão de YAML
        working-directory: core/fuzz
        run: cargo +"$NIGHTLY" fuzz run formato_yaml --fuzz-dir . -- -max_total_time="$FUZZ_SEG" -max_len=4096
      - name: Fuzz curto da conversão de TOML
        working-directory: core/fuzz
        run: cargo +"$NIGHTLY" fuzz run formato_toml --fuzz-dir . -- -max_total_time="$FUZZ_SEG" -max_len=4096
