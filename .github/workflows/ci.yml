name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    # Linux: minuto de macOS custa ~10x; o build do app no macOS fica no job `app`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # O clippy do workspace compila o app Tauri, que no Linux precisa do WebKitGTK.
      - name: Dependências do Tauri (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      # rust-toolchain.toml fixa a versão; o rustup do runner instala sozinho.
      - uses: Swatinem/rust-cache@v2
      # O app embute app/dist; o clippy do workspace precisa dele existir.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm build
        working-directory: app
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Benchmark compila
        run: cargo bench -p nucleo --no-run

  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - name: Build do app (sem bundle)
        run: pnpm tauri build --no-bundle
        working-directory: app

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz curto do índice de linhas
        working-directory: core/fuzz
        run: cargo +nightly fuzz run indice_linhas --fuzz-dir . -- -max_total_time=60
      - name: Fuzz curto da descompactação
        working-directory: core/fuzz
        run: cargo +nightly fuzz run compactado --fuzz-dir . -- -max_total_time=60
      - name: Fuzz curto da busca
        working-directory: core/fuzz
        run: cargo +nightly fuzz run busca --fuzz-dir . -- -max_total_time=60 -max_len=4096
      - name: Fuzz curto das linhas inválidas
        working-directory: core/fuzz
        run: cargo +nightly fuzz run erros --fuzz-dir . -- -max_total_time=60 -max_len=4096
