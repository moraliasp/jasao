<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup · visualizador de JSON</title>
<style>
/* Tokens copiados do Leve (src/styles.css) */
:root {
  --bar-bg: #f6f8fa; --bar-fg: #1f2328; --bar-muted: #656d76; --border: #d0d7de;
  --page-bg: #ffffff; --accent: #0969da; --hover: rgba(0,0,0,0.06);
  --change: #9a6700; --ok: #1a7f37; --del: #cf222e;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
}
:root[data-theme="dark"] {
  --bar-bg: #161b22; --bar-fg: #e6edf3; --bar-muted: #8d96a0; --border: #30363d;
  --page-bg: #0d1117; --accent: #2f81f7; --hover: rgba(255,255,255,0.08);
  --change: #d29922; --ok: #3fb950; --del: #f85149;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; background: var(--page-bg); color: var(--bar-fg); font-size: 14px; line-height: 1.5; scrollbar-color: var(--border) transparent; }
::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 4px; }
button, select { font: inherit; color: inherit; }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Barra superior e abas de arquivo: mesma anatomia do Leve */
.top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; height: 44px; padding: 0 10px; background: var(--bar-bg); border-bottom: 1px solid var(--border); }
.top .side { display: flex; align-items: center; gap: 2px; }
.top .side.end { justify-content: flex-end; gap: 8px; }
.top .name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ib { display: grid; place-items: center; width: 28px; height: 28px; border: 0; border-radius: 6px; background: none; color: var(--bar-muted); cursor: pointer; }
.ib:hover { background: var(--hover); color: var(--bar-fg); }
.ib:disabled { opacity: .4; cursor: default; background: none; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--page-bg); font-size: 13px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn:active { transform: translateY(1px); }
.files { display: flex; align-items: flex-end; height: 34px; padding: 0 10px; background: var(--bar-bg); border-bottom: 1px solid var(--border); }
.file { display: flex; align-items: center; gap: 6px; height: 30px; margin-bottom: -1px; padding: 0 6px 0 12px; border: 1px solid var(--border); border-bottom-color: var(--page-bg); border-radius: 6px 6px 0 0; background: var(--page-bg); font-size: 13px; }
.file .ib { width: 20px; height: 20px; }
.file .ib svg { width: 12px; height: 12px; }

.body { flex: 1; display: flex; min-height: 0; }
nav.fmt { width: 220px; flex: none; padding: 14px 8px; background: var(--bar-bg); border-right: 1px solid var(--border); overflow: auto; }
nav.fmt.off { display: none; }
nav.fmt h2 { margin: 0 8px 6px; font-size: 12px; font-weight: 600; color: var(--bar-muted); }
nav.fmt button { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; width: 100%; padding: 5px 8px; border: 0; border-radius: 6px; background: none; color: var(--bar-muted); font-size: 13px; text-align: left; cursor: pointer; }
nav.fmt button:hover { background: var(--hover); color: var(--bar-fg); }
nav.fmt button[aria-current="true"] { color: var(--accent); font-weight: 600; }
nav.fmt button span:last-child { font-variant-numeric: tabular-nums; font-weight: 400; font-size: 12px; }
nav.fmt p { margin: 14px 8px 0; font-size: 12px; color: var(--bar-muted); }

main { flex: 1; min-width: 0; overflow: auto; }
.views { position: sticky; top: 0; z-index: 1; display: flex; gap: 4px; padding: 0 24px; background: var(--page-bg); border-bottom: 1px solid var(--border); }
.views button { padding: 10px 10px 9px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--bar-muted); font-size: 13px; cursor: pointer; }
.views button:hover { color: var(--bar-fg); }
.views button[aria-selected="true"] { color: var(--bar-fg); font-weight: 600; border-bottom-color: var(--accent); }
.pane { max-width: 980px; padding: 28px 24px 48px; }
.pane h1 { margin: 0; padding-bottom: 8px; border-bottom: 1px solid var(--border); font-size: 22px; font-weight: 600; font-family: var(--mono); }
.pane h1.plain { font-family: inherit; }
.lead { margin: 10px 0 20px; color: var(--bar-muted); font-size: 13px; }
.lead code, td code { font-family: var(--mono); font-size: 12.5px; }

.scroll { overflow-x: auto; }
table { width: 100%; min-width: 620px; border-collapse: collapse; font-size: 13px; }
th { padding: 6px 10px; border-bottom: 1px solid var(--border); color: var(--bar-muted); font-size: 12px; font-weight: 600; text-align: left; }
td { padding: 5px 10px; border-bottom: 1px solid color-mix(in srgb, var(--border) 55%, transparent); vertical-align: baseline; }
tbody tr:hover td { background: var(--hover); }
td.k, td.t { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; }
td.t { color: var(--bar-muted); }
td.n { color: var(--bar-muted); }
td.p, th.p { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.p.all { color: var(--bar-muted); }
tr.g td { padding-top: 12px; font-weight: 600; }
tr.g:hover td { background: none; }
.warn { display: inline-flex; align-items: baseline; gap: 6px; color: var(--change); }
.warn svg { width: 13px; height: 13px; align-self: center; }
.step { display: flex; align-items: center; gap: 6px; height: 28px; font-size: 13px; font-variant-numeric: tabular-nums; }
.step code { font-family: var(--mono); font-size: 12.5px; }
.busca { margin-left: auto; }
.busca input { width: 240px; max-width: 100%; height: 28px; padding: 0 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--page-bg); font: inherit; font-size: 13px; color: var(--bar-fg); }
.tree { padding: 6px 0; border: 1px solid var(--border); border-radius: 6px; font: 12.5px/1.5 var(--mono); }
.row { display: flex; align-items: center; gap: 8px; min-height: 26px; padding-right: 8px; }
.row:hover, .row:focus-within { background: var(--hover); }
.row .ib, .row .sp { width: 20px; height: 20px; flex: none; }
.row .ib svg { width: 13px; height: 13px; }
.row .key { color: var(--bar-muted); white-space: nowrap; }
.row .val { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .val.dim { color: var(--bar-muted); }
.row .cp { margin-left: auto; opacity: 0; }
.row:hover .cp, .row .cp:focus-visible { opacity: 1; }
@media (hover: none) { .row .cp { opacity: 1; } }
mark { border-radius: 2px; background: color-mix(in srgb, var(--change) 32%, transparent); color: inherit; }
td.m { white-space: nowrap; }
td.m svg { width: 13px; height: 13px; margin-right: 6px; vertical-align: -2px; }
td.m.plus { color: var(--ok); }
td.m.minus { color: var(--del); }
td.now { color: var(--bar-fg); }
span.n { color: var(--bar-muted); }
.pane table + .lead, .scroll + .lead { margin-top: 16px; }

.tools { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; margin: 18px 0 14px; }
.tools label { display: grid; gap: 4px; font-size: 12px; color: var(--bar-muted); }
.tools select { height: 28px; padding: 0 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--page-bg); font-size: 13px; }
.tools .acts { display: flex; gap: 8px; margin-left: auto; }
.check { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 13px; color: var(--ok); }
.check.bad { color: var(--change); }
pre { margin: 0; padding: 14px 16px; border: 1px solid var(--border); border-radius: 6px; background: var(--bar-bg); font: 12.5px/1.55 var(--mono); overflow-x: auto; tab-size: 2; }
pre .c { color: var(--bar-muted); }
.empty { margin-top: 24px; color: var(--bar-muted); }

@media (max-width: 700px) {
  nav.fmt { position: absolute; z-index: 2; top: 79px; bottom: 0; box-shadow: 4px 0 16px rgba(0,0,0,.12); }
  .views, .pane { padding-left: 16px; padding-right: 16px; }
  .top .name { font-size: 12px; }
}
@media (prefers-reduced-motion: no-preference) {
  .ib, .btn, nav.fmt button, .views button { transition: background-color .15s, color .15s; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="panel" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></symbol>
  <symbol id="left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
  <symbol id="moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
  <symbol id="alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
  <symbol id="copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
  <symbol id="down" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>

  <symbol id="swap" viewBox="0 0 24 24"><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></symbol>
</svg>

<header class="top">
  <div class="side">
    <button class="ib" id="tgl" aria-label="Mostrar ou esconder formatos" aria-expanded="true"><svg class="i"><use href="#panel"/></svg></button>
    <button class="ib" aria-label="Voltar" disabled><svg class="i"><use href="#left"/></svg></button>
    <button class="ib" aria-label="Avançar" disabled><svg class="i"><use href="#right"/></svg></button>
  </div>
  <div class="name">monitor-20261120.jsonl</div>
  <div class="side end">
    <button class="ib" id="theme" aria-label="Alternar tema claro e escuro"><svg class="i"><use href="#moon"/></svg></button>
    <button class="btn">Abrir...</button>
  </div>
</header>
<div class="files">
  <div class="file">monitor-20261120.jsonl <button class="ib" aria-label="Fechar aba"><svg class="i"><use href="#x"/></svg></button></div>
</div>

<div class="body">
  <nav class="fmt" id="nav" aria-label="Formatos de registro">
    <h2>Formatos</h2>
    <div id="fmts"></div>
    <p>1.297 registros, 573 KB. Nenhuma linha inválida. O campo <code style="font-family:var(--mono)">tipo</code> distingue os formatos.</p>
  </nav>
  <main>
    <div class="views" role="tablist" id="views"></div>
    <div class="pane" id="pane"></div>
  </main>
</div>

<script>
// Linha: [nível, campo, tipo, observação, presentes, de, aviso?]  ·  Grupo: {g, p, de}
const all = (d, k, t, n, w) => [d, k, t, n, 0, 0, w];
const F = {
  tick: { n: 832, rows: [
    all(0,'ts','string','data e hora ISO'), all(0,'tipo','"tick"','distingue o formato'), all(0,'n','inteiro','de 1 a 412'),
    all(0,'pings','objeto','4 campos'),
    all(1,'pi (tailscale)','número | nulo','nulo em 511'), all(1,'pi (lan)','"fora" | nulo','nulo em 1'),
    all(1,'wallbox','"fora" | nulo','nulo em 1'), all(1,'roteador','"fora" | nulo','nulo em 1'),
    all(0,'pi','objeto','2 formas, nunca juntas'),
    { g: 'forma status', p: 320, de: 832 },
    ...['svc','sha','net','journal'].map(k => all(2,k,'string','um valor só hoje')),
    ...['pid','restarts','fila','sinal','temp','load'].map(k => all(2,k,'string','número guardado como texto',1)),
    all(2,'desde','string','data fora do padrão ISO',1), all(2,'ip','string','endereço com máscara'),
    all(2,'wallbox','"ok" | "falha"','2 valores'), [2,'gw','string','ausente em 1',319,320],
    { g: 'forma erro', p: 512, de: 832 },
    all(2,'erro','string','2 mensagens distintas'),
    all(0,'live','objeto','7 campos'),
    all(1,'energyKwh','número','de 1862,3 a 1865,4'), all(1,'powerW','inteiro','de 0 a 12654'),
    all(1,'voltage','número','inteiro em 24 registros'), all(1,'source','"pi"','um valor só hoje'),
    all(1,'online','true','um valor só hoje'), all(1,'chargingSince','string','data e hora ISO'), all(1,'at','string','data e hora ISO'),
    all(0,'fs_erro','string | nulo','preenchido em 12'),
  ]},
  amostra: { n: 438, rows: [
    all(0,'ts','string','data e hora ISO'), all(0,'tipo','"amostra"','distingue o formato'),
    all(0,'at','inteiro','tempo em milissegundos (epoch)'), all(0,'hora','string','hora HH:MM:SS'), all(0,'w','número','de 2,1 a 7331,6'),
    all(0,'dps','objeto','mapa: 18 códigos numéricos como chave'),
    all(1,'16','booleano','sempre true'), all(1,'116','string','número guardado como texto',1),
    all(1,'outros 16 códigos','número','maioria inteiro; 8 nunca variam'),
  ]},
  evento: { n: 27, rows: [
    all(0,'ts','string','data e hora ISO'), all(0,'tipo','"evento"','distingue o formato'), all(0,'msg','string','9 mensagens distintas'),
  ]},
};
const VIEWS = ['Estrutura', 'Valores', 'Diff', 'Exportar'];
const S = { fmt: 'tick', view: 'Estrutura', out: 'zod', one: 'generico', num: 'texto', dif: 'todas', rec: 0, q: '' };
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const icon = id => `<svg class="i" aria-hidden="true"><use href="#${id}"/></svg>`;

function estrutura() {
  const f = F[S.fmt];
  const tr = r => r.g
    ? `<tr class="g"><td style="padding-left:30px" colspan="3">${r.g}</td><td class="p">${r.p} de ${r.de}</td></tr>`
    : `<tr><td class="k" style="padding-left:${10 + r[0] * 20}px">${esc(r[1])}</td><td class="t">${esc(r[2])}</td>
       <td class="n">${r[6] ? `<span class="warn">${icon('alert')}${r[3]}</span>` : r[3]}</td>
       <td class="p ${r[4] ? '' : 'all'}">${r[4] ? `${r[4]} de ${r[5]}` : 'todos'}</td></tr>`;
  return `<h1>${S.fmt}</h1>
    <p class="lead">${f.n.toLocaleString('pt-BR')} de 1.297 registros têm este formato.</p>
    <div class="scroll"><table><thead><tr><th>Campo</th><th>Tipo</th><th>O que foi observado</th><th class="p">Presente em</th></tr></thead>
    <tbody>${f.rows.map(tr).join('')}</tbody></table></div>`;
}

// Gerador ilustrativo: as duas opções mudam o código de verdade.
function zod() {
  const one = (lit, gen) => S.one === 'literal' ? `z.literal(${lit})` : gen;
  const num = S.num === 'numero' ? 'z.coerce.number()' : 'z.string()';
  const hoje = S.one === 'literal' ? 'z.literal("…")' : 'z.string()';
  return `import { z } from "zod";

// pi tem 2 formas no arquivo: status (320 registros) e erro (512)
const PiStatus = z.object({
${['svc','sha','net','journal'].map(k => `  ${k}: ${hoje}, // um valor só hoje`).join('\n')}
${['pid','restarts','fila','sinal','temp','load'].map(k => `  ${k}: ${num}, // número guardado como texto`).join('\n')}
  desde: z.string(), // data fora do padrão ISO, mantida como texto
  ip: z.string(),
  wallbox: z.enum(["ok", "falha"]),
  gw: z.string().optional(), // ausente em 1 de 320
});
const PiErro = z.object({ erro: z.string() });

const Tick = z.object({
  ts: z.iso.datetime(),
  tipo: z.literal("tick"),
  n: z.number().int(),
  pings: z.object({
    "pi (tailscale)": z.number().nullable(),
    "pi (lan)": z.literal("fora").nullable(),
    wallbox: z.literal("fora").nullable(),
    roteador: z.literal("fora").nullable(),
  }),
  pi: z.union([PiStatus, PiErro]),
  live: z.object({
    energyKwh: z.number(),
    powerW: z.number().int(),
    voltage: z.number(),
    source: ${one('"pi"', 'z.string()')},
    online: ${one('true', 'z.boolean()')},
    chargingSince: z.iso.datetime(),
    at: z.iso.datetime(),
  }),
  fs_erro: z.string().nullable(),
});

const Amostra = z.object({
  ts: z.iso.datetime(),
  tipo: z.literal("amostra"),
  at: z.number().int(), // tempo em milissegundos (epoch)
  hora: z.iso.time(),
  w: z.number(),
  // 18 códigos numéricos como chave: tratado como mapa
  dps: z.record(z.string(), z.union([z.number(), z.boolean(), z.string()])),
});

const Evento = z.object({
  ts: z.iso.datetime(),
  tipo: z.literal("evento"),
  msg: z.string(),
});

export const Registro = z.discriminatedUnion("tipo", [Tick, Amostra, Evento]);
export type Registro = z.infer<typeof Registro>;`;
}
function schema() {
  const dt = { type: 'string', format: 'date-time' }, str = { type: 'string' };
  const one = (v, gen) => S.one === 'literal' ? { const: v } : gen;
  const num = S.num === 'numero' ? { type: 'number' } : { type: 'string', pattern: '^-?\\d+(\\.\\d+)?$' };
  const fora = { enum: ['fora', null] };
  const obj = (properties, opcionais = []) => ({ type: 'object', properties, required: Object.keys(properties).filter(k => !opcionais.includes(k)) });
  const lista = (ks, v) => Object.fromEntries(ks.map(k => [k, v]));
  return JSON.stringify({
    $schema: 'https://json-schema.org/draft/2020-12/schema',
    title: 'Registro',
    oneOf: ['Tick', 'Amostra', 'Evento'].map(n => ({ $ref: '#/$defs/' + n })),
    $defs: {
      PiStatus: obj({ ...lista(['svc','sha','net','journal'], one('…', str)), ...lista(['pid','restarts','fila','sinal','temp','load'], num),
        desde: str, ip: str, wallbox: { enum: ['ok', 'falha'] }, gw: str }, ['gw']),
      PiErro: obj({ erro: str }),
      Tick: obj({ ts: dt, tipo: { const: 'tick' }, n: { type: 'integer' },
        pings: obj({ 'pi (tailscale)': { type: ['number', 'null'] }, 'pi (lan)': fora, wallbox: fora, roteador: fora }),
        pi: { oneOf: [{ $ref: '#/$defs/PiStatus' }, { $ref: '#/$defs/PiErro' }] },
        live: obj({ energyKwh: { type: 'number' }, powerW: { type: 'integer' }, voltage: { type: 'number' },
          source: one('pi', str), online: one(true, { type: 'boolean' }), chargingSince: dt, at: dt }),
        fs_erro: { type: ['string', 'null'] } }),
      Amostra: obj({ ts: dt, tipo: { const: 'amostra' }, at: { type: 'integer' }, hora: { type: 'string', format: 'time' }, w: { type: 'number' },
        dps: { type: 'object', additionalProperties: { type: ['number', 'boolean', 'string'] } } }),
      Evento: obj({ ts: dt, tipo: { const: 'evento' }, msg: str }),
    },
  }, null, 2);
}
const codigo = () => S.out === 'zod' ? zod() : schema();

const sel = (id, label, opts) => `<label>${label}<select id="${id}">${opts.map(([v, t]) => `<option value="${v}"${S[id] === v ? ' selected' : ''}>${t}</option>`).join('')}</select></label>`;

// Diff ilustrativo: [formato, caminho, ícone, mudança, antes, depois, quebra]
// Quebra = registro novo não passa na estrutura antiga.
const D = [
  ['tick', 'live.voltage', 'swap', 'Tipo mudou', 'inteiro', 'número', 1],
  ['tick', 'live.uptime', 'minus', 'Campo removido', 'inteiro', '', 1],
  ['tick', 'pi (status).gw', 'swap', 'Ficou opcional', 'em todos', 'ausente em 1', 1],
  ['tick', 'pi (status).wallbox', 'swap', 'Valor novo', '"ok"', '"ok" | "falha"', 1],
  ['tick', 'fs_erro', 'plus', 'Campo novo', '', 'string | nulo', 0],
  ['amostra', 'dps', 'swap', 'Chave nova no mapa', '17 códigos', '18 códigos', 0],
];
function diff() {
  const rows = S.dif === 'quebra' ? D.filter(r => r[6]) : D, q = D.filter(r => r[6]).length;
  const cel = v => v ? esc(v) : '<span aria-label="não existe">–</span>';
  const corpo = Object.keys(F).map(f => {
    const rs = rows.filter(r => r[0] === f);
    return rs.length ? `<tr class="g"><td colspan="5">${f}</td></tr>` + rs.map(r =>
      `<tr><td class="k" style="padding-left:30px">${esc(r[1])}</td><td class="m ${r[2]}">${icon(r[2])}${r[3]}</td>
       <td class="t">${cel(r[4])}</td><td class="t now">${cel(r[5])}</td>
       <td>${r[6] ? `<span class="warn">${icon('alert')}Quebra</span>` : '<span class="n">Compatível</span>'}</td></tr>`).join('') : '';
  }).join('');
  return `<h1 class="plain">Diff de estrutura</h1>
    <div class="tools">
      <label>Antes<button class="btn">monitor-20261119.jsonl</button></label>
      <label>Depois<button class="btn">monitor-20261120.jsonl</button></label>
      ${sel('dif', 'Mostrar', [['todas', 'Todas as mudanças'], ['quebra', 'Só as que quebram']])}
    </div>
    <p class="check ${q ? 'bad' : ''}" role="status">${q
      ? icon('alert') + `${q} das ${D.length} mudanças quebram quem valida com a estrutura de antes.`
      : icon('check') + 'Nenhuma mudança quebra quem valida com a estrutura de antes.'}</p>
    <div class="scroll"><table><thead><tr><th>Campo</th><th>Mudança</th><th>Antes</th><th>Depois</th><th>Efeito</th></tr></thead>
    <tbody>${corpo}</tbody></table></div>
    <p class="lead">Quebra quando um registro do arquivo novo não passa na estrutura do antigo. O formato <code>evento</code> e os outros 34 campos não mudaram.</p>`;
}

// Valores: registros inventados no formato do arquivo (nenhum valor real do log).
const R = [
  [412, { ts: '2026-11-20T08:14:02.118Z', tipo: 'tick', n: 57,
    pings: { 'pi (tailscale)': 12.4, 'pi (lan)': null, wallbox: null, roteador: null },
    pi: { svc: 'active', pid: '812', restarts: '0', desde: 'Thu 2026-11-19 22:03:11 -03', sha: 'a1b2c3d', ip: '192.0.2.10/24', gw: '192.0.2.1',
      sinal: '-52', temp: '48.3', load: '0.12', fila: '0', wallbox: 'ok', net: 'wlan0', journal: 'ok' },
    live: { energyKwh: 1863.7, powerW: 7320, voltage: 229.4, source: 'pi', online: true, chargingSince: '2026-11-20T07:02:40.000Z', at: '2026-11-20T08:14:01.900Z' },
    fs_erro: null }],
  [413, { ts: '2026-11-20T08:15:02.204Z', tipo: 'tick', n: 58,
    pings: { 'pi (tailscale)': null, 'pi (lan)': 'fora', wallbox: null, roteador: null },
    pi: { erro: 'tempo esgotado' },
    live: { energyKwh: 1863.8, powerW: 7318, voltage: 230, source: 'pi', online: true, chargingSince: '2026-11-20T07:02:40.000Z', at: '2026-11-20T08:15:01.950Z' },
    fs_erro: null }],
  [414, { ts: '2026-11-20T08:15:04.010Z', tipo: 'amostra', at: 1795162504010, hora: '08:15:04', w: 7331.6,
    dps: Object.fromEntries([[16, true], [116, '12'], ...[18, 19, 20, 101, 102, 103, 104, 105, 106, 107, 108, 109, 110, 111, 112, 113].map((c, i) => [c, i * 7])]) }],
  [415, { ts: '2026-11-20T08:15:30.662Z', tipo: 'evento', msg: 'wallbox voltou a responder' }],
];
const fechados = new Set();
let LR = [];
// Caminho no estilo jq: .pi.sinal, .pings["pi (lan)"]
const seg = k => /^[A-Za-z_]\w*$/.test(k) ? '.' + k : `[${JSON.stringify(k)}]`;
function linhas(v, d, path, out) {
  for (const [k, x] of Object.entries(v)) {
    const p = path + seg(k), obj = x !== null && typeof x === 'object';
    out.push({ k, d, p, obj, v: x });
    if (obj && (S.q || !fechados.has(p))) linhas(x, d + 1, p, out);
  }
  return out;
}
function arvore() {
  const q = S.q.trim().toLowerCase();
  const hl = s => { const e = esc(s); if (!q) return e; const i = e.toLowerCase().indexOf(esc(q)); return i < 0 ? e : e.slice(0, i) + '<mark>' + e.slice(i, i + esc(q).length) + '</mark>' + e.slice(i + esc(q).length); };
  const bate = r => r.k.toLowerCase().includes(q) || (!r.obj && String(r.v).toLowerCase().includes(q));
  const todas = linhas(R[S.rec][1], 0, '', []), achou = todas.filter(bate);
  LR = q ? todas.filter(r => achou.some(a => a.p === r.p || a.p.startsWith(r.p + '.') || a.p.startsWith(r.p + '['))) : todas;
  if (!LR.length) return `<p class="empty">Nenhum campo ou valor com "${esc(S.q)}" neste registro.</p>`;
  return (q ? `<p class="lead">${achou.length} ${achou.length === 1 ? 'resultado' : 'resultados'} neste registro.</p>` : '') +
    `<div class="tree">${LR.map((r, i) => {
      const aberto = S.q || !fechados.has(r.p);
      return `<div class="row" style="padding-left:${8 + r.d * 20}px">
        ${r.obj ? `<button class="ib" data-t="${i}" aria-expanded="${!!aberto}" aria-label="${aberto ? 'Recolher' : 'Expandir'} ${esc(r.k)}">${icon(aberto ? 'chev' : 'right')}</button>` : '<span class="sp"></span>'}
        <span class="key">${hl(r.k)}</span>
        <span class="val ${r.obj || r.v === null ? 'dim' : ''}">${r.obj ? Object.keys(r.v).length + ' campos' : hl(JSON.stringify(r.v))}</span>
        <button class="ib cp" data-p="${i}" aria-label="Copiar caminho ${esc(r.p).replace(/"/g, '&quot;')}">${icon('copy')}</button></div>`;
    }).join('')}</div>`;
}
function valores() {
  const [linha, reg] = R[S.rec];
  return `<h1 class="plain">Valores</h1>
    <div class="tools">
      <div class="step"><button class="ib" id="prev" aria-label="Registro anterior">${icon('left')}</button>
        <span>Linha ${linha} de 1.297, formato <code>${reg.tipo}</code></span>
        <button class="ib" id="next" aria-label="Próximo registro">${icon('right')}</button></div>
      <label class="busca">Buscar campo ou valor<input id="q" type="search" value="${esc(S.q).replace(/"/g, '&quot;')}" autocomplete="off" spellcheck="false"></label>
    </div>
    <div id="tree">${arvore()}</div>`;
}

function exportar() {
  // JSON Schema não converte tipos: pedir número onde o arquivo tem texto reprova o próprio arquivo.
  const bad = S.out === 'schema' && S.num === 'numero';
  const code = esc(codigo()).replace(/(\/\/.*)$/gm, '<span class="c">$1</span>');
  return `<h1 class="plain">Exportar estrutura</h1>
    <div class="tools">
      ${sel('out', 'Saída', [['zod', 'Zod'], ['schema', 'JSON Schema']])}
      ${sel('one', 'Campo com um valor só', [['generico', 'Tipo genérico'], ['literal', 'Travar no valor']])}
      ${sel('num', 'Número guardado como texto', [['texto', 'Manter texto'], ['numero', 'Tratar como número']])}
      <div class="acts"><button class="btn" id="cp">${icon('copy')}<span>Copiar</span></button><button class="btn" id="sv">${icon('down')}Salvar arquivo</button></div>
    </div>
    <p class="check ${bad ? 'bad' : ''}" role="status">${bad
      ? icon('alert') + '320 registros não passam: têm texto onde este schema pede número. Volte para "Manter texto" ou exporte em Zod.'
      : icon('check') + 'Os 1.297 registros do arquivo passam nesta estrutura.'}</p>
    <pre tabindex="0" aria-label="Código gerado">${code}</pre>`;
}

function render() {
  $('fmts').innerHTML = Object.entries(F).map(([k, f]) =>
    `<button data-f="${k}" aria-current="${S.view === 'Estrutura' && k === S.fmt}"><span>${k}</span><span>${f.n}</span></button>`).join('');
  $('views').innerHTML = VIEWS.map(v => `<button role="tab" data-v="${v}" aria-selected="${v === S.view}">${v}</button>`).join('');
  $('pane').innerHTML = S.view === 'Estrutura' ? estrutura() : S.view === 'Exportar' ? exportar() : S.view === 'Diff' ? diff()
    : valores();
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.f) { S.fmt = b.dataset.f; S.view = 'Estrutura'; render(); }
  else if (b.dataset.v) { S.view = b.dataset.v; render(); document.querySelector('[aria-selected="true"]').focus(); }
  else if (b.dataset.t) { const p = LR[b.dataset.t].p; fechados.has(p) ? fechados.delete(p) : fechados.add(p); $('tree').innerHTML = arvore(); document.querySelector(`[data-t="${b.dataset.t}"]`).focus(); }
  else if (b.dataset.p) navigator.clipboard.writeText(LR[b.dataset.p].p).then(() => { b.innerHTML = icon('check'); setTimeout(() => b.innerHTML = icon('copy'), 1500); });
  else if (b.id === 'prev' || b.id === 'next') { S.rec = (S.rec + (b.id === 'next' ? 1 : R.length - 1)) % R.length; render(); $(b.id).focus(); }
  else if (b.id === 'tgl') b.setAttribute('aria-expanded', !$('nav').classList.toggle('off'));
  else if (b.id === 'theme') document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  else if (b.id === 'cp') navigator.clipboard.writeText(codigo()).then(() => { const s = b.querySelector('span'); s.textContent = 'Copiado'; setTimeout(() => s.textContent = 'Copiar', 1500); });
  else if (b.id === 'sv') Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([codigo()])), download: S.out === 'zod' ? 'registro.ts' : 'registro.schema.json' }).click();
});
document.addEventListener('change', e => { if (e.target.id in S) { S[e.target.id] = e.target.value; render(); $(e.target.id).focus(); } });
document.addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; $('tree').innerHTML = arvore(); } });
console.assert(seg('pi (lan)') === '["pi (lan)"]' && seg('gw') === '.gw', 'caminho');
if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
if (innerWidth <= 700) $('tgl').click();
render();
// Autoteste: os dois geradores produzem saída coerente em todas as combinações de opção.
for (const one of ['generico', 'literal']) for (const num of ['texto', 'numero']) {
  const t = { ...S }; Object.assign(S, { one, num });
  console.assert(JSON.parse(schema()).$defs.Tick.required.length === 7 && zod().includes('discriminatedUnion'), 'gerador', one, num);
  Object.assign(S, t);
}
</script>
</body>
