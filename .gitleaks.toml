# gitleaks: tudo o que o scan padrão acusa neste repositório são segredos falsos de teste
# (máscara de segredos, cURL com credencial, JWT da vitrine). Liberados pelo valor exato;
# qualquer outro valor continua sendo acusado, em qualquer arquivo.

[extend]
useDefault = true

[[allowlists]]
description = "Segredos falsos dos testes e da vitrine"
regexTarget = "secret"
regexes = [
  '''^eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiJjbGllbnRlLWZpY3RpY2lvLTQyIiwibm9tZSI6IkdhbmltZWRlcyBMdWEiLCJpYXQiOjE3MDAwMDAwMDAsImV4cCI6MTkwMDAwMDAwMH0\.assinatura\-ficticia\-nao\-conferida$''',
  '''^fulano:s3nh4$''',
  '''^fulano:seg\-c1$''',
  '''^ghp_0123456789abcdefghijABCDEFGHIJ0123$''',
  '''^glpat\-abcdefghijklmnopqrst$''',
  '''^seg\-123abc$''',
  '''^sk_test_abcdefghijklmnopqrst$''',
]
