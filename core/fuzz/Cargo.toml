[package]
name = "nucleo-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nucleo = { path = ".." }
flate2 = "1.1"
zstd = "0.14"

# Workspace próprio: o fuzz roda no nightly e fica fora do workspace principal.
[workspace]
members = ["."]

[[bin]]
name = "indice_linhas"
path = "fuzz_targets/indice_linhas.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compactado"
path = "fuzz_targets/compactado.rs"
test = false
doc = false
bench = false

[[bin]]
name = "busca"
path = "fuzz_targets/busca.rs"
test = false
doc = false
bench = false
