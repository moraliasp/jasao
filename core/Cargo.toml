[package]
name = "nucleo"
description = "Leitura e índices de JSON/JSONL, sem dependência de interface."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
flate2 = "1.1.11"
fs4 = "1.1.0"
memchr = "2.8"
memmap2 = "0.9"
rayon = "1"
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
sonic-rs = "0.5.12"
zstd = "0.14.4"

[dev-dependencies]
proptest = "1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
simd-json = "0.19.0"
tempfile = "3"

[[bench]]
name = "indice"
harness = false

[[bench]]
name = "compactado"
harness = false

[[bench]]
name = "busca"
harness = false

[[bench]]
name = "estrutura"
harness = false

[[bench]]
name = "parsers"
harness = false

[[bench]]
name = "arvore"
harness = false
