[package]
name = "nucleo"
description = "Leitura e índices de JSON/JSONL, sem dependência de interface."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
memchr = "2.8"
memmap2 = "0.9"

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"

[[bench]]
name = "indice"
harness = false
